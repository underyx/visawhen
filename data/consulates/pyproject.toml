[project]
name = "consulates"
version = "0.1.0"
description = ""
authors = [{ name = "Bence Nagy", email = "bence@underyx.me" }]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34.2,<3",
  "pandas>=3.0.5,<4",
  "beautifulsoup4>=4.15.0,<5",
  "lxml>=6.1.2,<7",
  "arrow>=1.4.0,<2",
  # the issuance tables are read from the PDFs' text layer; no more camelot
  # (ghostscript/OpenCV page rendering), which took ~0.5 s per page
  "pypdf>=6.16.2,<7",
  "joblib>=1.5.3,<2",
  "sqlite-diffable>=0.6,<0.7",
]

[tool.ruff]
extend = "../../.ruff.toml"
