[tool.poetry]
name = "consulates"
version = "0.1.0"
description = ""
authors = ["Bence Nagy <bence@underyx.me>"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.34.2"
pandas = "^3.0.5"
beautifulsoup4 = "^4.15.0"
lxml = "^6.1.2"
arrow = "^1.4.0"
# the issuance tables are read from the PDFs' text layer; no more camelot
# (ghostscript/OpenCV page rendering), which took ~0.5 s per page
pypdf = "^6.16.2"
nbconvert = "^7.17.1"
joblib = "^1.5.3"
sqlite-diffable = "^0.6"

[tool.poetry.dev-dependencies]
ipykernel = "^7.3.0"
notebook = "^7.6.2"
jupyter = "^1.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend = "../../.ruff.toml"
