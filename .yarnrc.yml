approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.0.cjs

# echarts-for-react imports tslib without declaring it; PnP is strict about
# undeclared dependencies, so declare it on its behalf.
packageExtensions:
  "echarts-for-react@*":
    dependencies:
      tslib: "^2.3.0"
