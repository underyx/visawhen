include = ["*.py", "*.pyi", "**/pyproject.toml"]
target-version = "py311"

[lint]
select = [
  "B",
  "C4",
  "E",
  "EXE",
  "F",
  "I",
  "ICN",
  "N",
  "SIM",
  "PD",
  "PGH",
  "RUF",
  "UP",
  "W",
]
ignore = ["E501"]

[lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]
