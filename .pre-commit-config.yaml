exclude: ^data/.+?/dump/.+?$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: fix-byte-order-marker

  # bun fmt formats the JavaScript, TypeScript, CSS, JSON, YAML, TOML and
  # Markdown files, as Prettier does (settings in bunfig.toml's [fmt]). It
  # takes a fraction of a second, so it runs on the whole repository.
  # --no-script: run the formatter, not a package.json script of that name.
  - repo: local
    hooks:
      - id: bun-fmt
        name: bun fmt
        entry: bun fmt --no-script
        language: system
        pass_filenames: false
        always_run: true
