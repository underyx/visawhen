exclude: ^([.]pnp[.]cjs|[.]pnp[.]loader[.]mjs|[.]yarn/.+?|.+?/[.]joblib_cache/.+?|data/.+?/dump/.+?)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: requirements-txt-fixer
      - id: fix-byte-order-marker

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.16.7"
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [attrs, types-requests]

  # Prettier stays at 3.0.0: newer versions reformat every nested ternary. The
  # hook is the one pre-commit/mirrors-prettier v3.0.0 defines, kept here
  # since that repository is archived.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        types: [text]
        additional_dependencies: ["prettier@3.0.0"]
        # written by npm and Dependabot
        exclude: ^[.]github/deploy-tools/package-lock[.]json$

  - repo: https://github.com/roy-ht/pre-commit-jupyter
    rev: v1.2.1
    hooks:
      - id: jupyter-notebook-cleanup
