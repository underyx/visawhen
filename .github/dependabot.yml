version: 2
updates:
  # Version updates wait until a release is a few days old (cooldown), so that
  # a compromised release is likely to have been caught and pulled first.
  # Security updates are not delayed.
  #
  # Every merge to main deploys the site, so updates are grouped where they
  # can be: one pull request to check and merge instead of one per package.

  # Actions are pinned to commit SHAs with a "# vX.Y.Z" comment; Dependabot
  # keeps both the SHA and the comment up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Most security updates are of packages the site only depends on
      # through others (tar, undici, js-yaml); without a group they come one
      # pull request each.
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # @types/node stays on Node.js 24, whose APIs Bun implements; a new
      # major of the types would describe APIs that Bun may not have.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 is the native compiler: next build's type check fails
      # with it (Dependabot PR #442).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # wrangler, which .github/workflows/deploy.yml runs with the deploy token in
  # its environment.
  - package-ecosystem: "bun"
    directory: "/.github/deploy-tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      deploy-tools:
        patterns:
          - "*"
