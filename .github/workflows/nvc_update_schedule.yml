# Also fetches State's IV Scheduling Status Tool (the consulate pages'
# interview queues), which lives on the same site and is fetched the same way:
# one workflow, so the two never race each other to push to main.
name: Update NVC and interview-queue data

on:
  schedule:
    # check every 30 minutes on Monday in the update window
    - cron: 3/30 14-16 * * 1
    # check every hour on Monday outside the update window
    - cron: 38 0-13,17-23 * * 1
    # check every day for the rest of the week; this run may also read
    # Google's search results, see SEARCH below
    - cron: 38 8 * * 0,2-6
    # Every hour from Monday's update window to the end of Wednesday, read
    # Google's search results and nothing else, see SEARCH_ONLY below. Change
    # these two lines and SEARCH_ONLY together.
    - cron: 8 15-23 * * 1
    - cron: 8 * * * 2,3
  workflow_dispatch:
    inputs:
      nvc_page_text:
        description: >-
          Text copied from State's NVC timeframes page, to add its numbers by
          hand. Leave empty to fetch as usual.
        type: string
        required: false

# Only the job that commits the data can push; the build and deploy jobs,
# which run third-party code, get a read-only token.
permissions:
  contents: read

jobs:
  update-nvc-data:
    name: Update NVC data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    env:
      # The hourly runs that only read Google's search results. They ask
      # State's site for nothing, so they skip the interview queue too.
      SEARCH_ONLY: >-
        ${{ github.event.schedule == '8 15-23 * * 1'
        || github.event.schedule == '8 * * * 2,3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # --frozen-lockfile: fail rather than change bun.lock
      - run: bun install --frozen-lockfile
      # State's site answers the scraper with HTTP 403, so there are two
      # more ways in. A run started by hand with the page's text adds that
      # text's numbers. And Google's search results quote the numbers: the
      # SEARCH_ONLY runs read them every hour from Monday afternoon until the
      # week's reading is in, and the daily run and runs started by hand read
      # them when no other source has anything new. A search happens only
      # once the newest reading is a week old, and costs a serper.dev credit
      # when Google has nothing new and three when it has: about 1,000 to
      # 1,500 credits a year. Without the SERPER_API_KEY secret, nothing is
      # searched.
      - name: Fetch the NVC timeframes
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PAGE_TEXT: ${{ inputs.nvc_page_text }}
          SEARCH: >-
            ${{ github.event_name == 'workflow_dispatch'
            || github.event.schedule == '38 8 * * 0,2-6' }}
        run: |
          if [ -n "$PAGE_TEXT" ]; then
            printf '%s\n' "$PAGE_TEXT" > "$RUNNER_TEMP/nvc-page.txt"
            bun data/nvc/main.ts --from-file "$RUNNER_TEMP/nvc-page.txt"
          elif [ "$SEARCH_ONLY" = "true" ]; then
            bun data/nvc/main.ts --search-only
          elif [ "$SEARCH" = "true" ]; then
            bun data/nvc/main.ts --search
          else
            bun data/nvc/main.ts
          fi
      # Adds a snapshot only when State's "Last Updated" date is newer than the
      # newest one in iv_schedule.json. It runs, and whatever either step wrote
      # is committed, even when the other step failed; the job still fails
      # then.
      - name: Fetch the interview-queue snapshot
        if: ${{ !cancelled() && env.SEARCH_ONLY != 'true' }}
        run: bun data/consulates/iv_schedule.ts --fetch
      - name: Commit changes
        id: commit
        if: ${{ !cancelled() }}
        env:
          MESSAGE: Update NVC and interview-queue data
          ACTOR: ${{ github.actor }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="$ACTOR" -c user.email="$ACTOR@users.noreply.github.com" \
            commit --quiet --message "$MESSAGE"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - id: head_commit
        if: ${{ !cancelled() }}
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Tells a Discord channel how each NVC timeframe changed, when the
      # commit above added NVC readings (see data/notify.ts; it posts nothing
      # when only the interview queue changed). Only this step sees the
      # webhook URL; without the secret it prints the message and ends green.
      # The message pings the "nvc-watch" role of the DISCORD_ROLES
      # repository variable (a JSON object of role names to IDs; read from
      # the secrets too, in case it is set as one). A refused post fails the
      # job, but the build and deploy below still run: the data is committed
      # by then.
      - name: Post the changes to Discord
        if: ${{ !cancelled() && steps.commit.outputs.pushed == 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLES: ${{ vars.DISCORD_ROLES || secrets.DISCORD_ROLES }}
        run: bun data/notify.ts

  build:
    # !cancelled(): build what was committed even when one of the two scripts
    # failed
    if: ${{ !cancelled() && needs.update-nvc-data.outputs.updated == 'true' }}
    uses: ./.github/workflows/build.yml
    needs: [update-nvc-data]
    with:
      ref: ${{ needs.update-nvc-data.outputs.new-commit-sha }}

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: [build]
    # When nothing was pushed, build is skipped, and so is this job.
    # !cancelled(): deploy even when one of the two scripts failed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
