# Also fetches State's IV Scheduling Status Tool (the consulate pages'
# interview queues), which lives on the same site and is fetched the same way:
# one workflow, so the two never race each other to push to main.
name: Update NVC and interview-queue data

on:
  schedule:
    # check every 30 minutes on Monday in the update window
    - cron: 3/30 14-16 * * 1
    # check every hour on Monday outside the update window
    - cron: 38 0-13,17-23 * * 1
    # check every day for the rest of the week
    - cron: 38 8 * * 0,2-6
  workflow_dispatch:

defaults:
  run:
    working-directory: data/nvc

jobs:
  update-nvc-data:
    name: Update NVC data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          # The dependency cache is keyed on the lockfile and saved by the
          # action's post step, even when a later step fails.
          enable-cache: true
          cache-dependency-glob: data/nvc/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Run script
        run: uv run python -u main.py
      # Adds a snapshot only when State's "Last Updated" date is newer than the
      # newest one in iv_schedule.json. It needs three packages, not the whole
      # consulates project (pandas, pypdf, jupyter...). It runs, and whatever
      # either step wrote is committed, even when the other step failed; the
      # job still fails then.
      - name: Fetch the interview-queue snapshot
        if: ${{ !cancelled() }}
        working-directory: data/consulates
        run: >-
          uv run --no-project
          --with 'requests>=2.34.2,<3' --with 'beautifulsoup4>=4.15.0,<5' --with 'lxml>=6.1.2,<7'
          python -u iv_schedule.py --fetch
      - name: Commit changes
        id: commit
        if: ${{ !cancelled() }}
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: Update NVC and interview-queue data
          # The default (`git fetch --tags --force`) pulls the whole history of
          # the 100 MB data dumps into the shallow clone: 3-4 minutes per run.
          fetch: false
      - id: head_commit
        if: ${{ !cancelled() }}
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # !cancelled(): build what was committed even when one of the two scripts
    # failed
    if: ${{ !cancelled() && needs.update-nvc-data.outputs.updated == 'true' }}
    uses: underyx/visawhen/.github/workflows/build.yml@main
    needs: [update-nvc-data]
    with:
      ref: ${{ needs.update-nvc-data.outputs.new-commit-sha }}

  deploy:
    uses: underyx/visawhen/.github/workflows/deploy.yml@main
    needs: [build]
    # When nothing was pushed, build is skipped, and so is this job.
    # !cancelled(): deploy even when one of the two scripts failed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
