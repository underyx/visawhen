name: pre-commit

on: workflow_call

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    # The hooks are third-party code: a read-only token, not left in .git/config
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # What pre-commit/action did, without its unpinned actions/cache@v4: the
      # hook environments are cached per Python and .pre-commit-config.yaml.
      # for the bun fmt hook
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # In CI every file is tracked, so --all-files checks everything.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
