# TEMPORARY: fills in the Visa Bulletin history on this pull request's branch,
# since the session that writes it cannot reach state.gov. Removed before the
# pull request merges. It commits to the branch it runs on and never deploys.
name: Backfill Visa Bulletins (temporary)

on:
  push:
    branches: [claude/project-thread-cc06w4]
    paths:
      - data/visa_bulletin/bulletin.py
      - .github/workflows/visa_bulletin_backfill_tmp.yml

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: data/visa_bulletin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python -u bulletin.py
      - name: Commit changes
        if: ${{ !cancelled() }}
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: Fill in the Visa Bulletins since October 2015
          fetch: false
