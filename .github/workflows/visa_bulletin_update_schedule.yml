name: Update Visa Bulletin data

on:
  schedule:
    # State publishes each month's bulletin around the middle of the month
    # before, on a day it does not announce, during the US working day;
    # check once a day, in the US evening.
    - cron: 52 21 * * *
  workflow_dispatch:

# Only the job that commits the data can push; the build and deploy jobs,
# which run third-party code, get a read-only token.
permissions:
  contents: read

jobs:
  update-visa-bulletin-data:
    name: Update Visa Bulletin data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # --frozen-lockfile: fail rather than change bun.lock
      - run: bun install --frozen-lockfile
      - name: Run script
        run: bun data/visa_bulletin/bulletin.ts
      # The bulletins that parsed are written even when another did not, and
      # committed; the job still fails then.
      - name: Commit changes
        id: commit
        if: ${{ !cancelled() }}
        env:
          MESSAGE: Update Visa Bulletin data
          ACTOR: ${{ github.actor }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="$ACTOR" -c user.email="$ACTOR@users.noreply.github.com" \
            commit --quiet --message "$MESSAGE"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - id: head_commit
        if: ${{ !cancelled() }}
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # !cancelled(): build what was committed even when a page did not parse
    if: ${{ !cancelled() && needs.update-visa-bulletin-data.outputs.updated == 'true' }}
    uses: ./.github/workflows/build.yml
    needs: [update-visa-bulletin-data]
    with:
      ref: ${{ needs.update-visa-bulletin-data.outputs.new-commit-sha }}

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: [build]
    # When nothing was pushed, build is skipped, and so is this job.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
