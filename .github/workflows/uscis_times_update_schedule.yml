# Schedule removed (2026-08): nothing on the site consumes the processing-times data, and
# egov.uscis.gov has blocked automated access (Cloudflare challenge) since
# 2024, so every scheduled run failed. Kept as a manual workflow only.
name: Update USCIS times data

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: data/uscis

jobs:
  update-uscis-times-data:
    name: Update USCIS times data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # `poetry env use python` makes poetry build its virtualenv from the
      # interpreter set up above; without it poetry picks the runner's system
      # python and the setup-python step has no effect.
      - name: Set up poetry
        run: |
          pipx install "poetry<2"
          poetry env use python
      - name: Cache poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-data-uscis-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('data/uscis/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Run script
        run: poetry run python times.py
      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          # The default (`git fetch --tags --force`) pulls the whole history of
          # the 100 MB data dumps into the shallow clone: 3-4 minutes per run.
          fetch: false
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
