# Schedule removed (2026-08): nothing on the site consumes data/uscis, and
# egov.uscis.gov has blocked automated access (Cloudflare challenge) since
# 2024, so every scheduled run failed. Kept as a manual workflow only.
name: Update USCIS times data

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: data/uscis

jobs:
  update-uscis-times-data:
    name: Update USCIS times data
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up poetry
        run: pipx install "poetry<2"
      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-data-uscis-${{ hashFiles('data/uscis/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Run script
        run: poetry run python times.py
      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@v11
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
