# bun lint, the TypeScript check and the unit tests. next build type-checks
# too, but since Next.js 16 it no longer lints. This is a workflow of its own
# rather than steps in build.yml, so that a lint error or a failing test does
# not hold back the data workflows' deploys.
name: Lint

on:
  workflow_call:
    inputs:
      ref:
        description: "The git ref to check"
        required: true
        type: string

jobs:
  lint:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The linter is built into Bun, so it needs no packages. No stable Bun
      # release has it yet, so it runs on the canary, the build of Bun's newest
      # commit. Once a stable release has it, drop these two steps, run
      # `bun lint --no-script` after the install below, and put that release
      # in .bun-version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      # --no-script: run the linter itself, not package.json's lint script
      - run: bun lint --no-script
      # The Bun that installs the packages, here and in build.yml. Dependabot
      # does not update .bun-version, so bump it by hand.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # --frozen-lockfile: fail rather than change bun.lock. --ignore-scripts:
      # sqlite3's native module is not needed to typecheck or test.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
