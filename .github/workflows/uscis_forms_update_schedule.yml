name: Update USCIS forms data

on:
  schedule:
    # USCIS publishes its quarterly reports at irregular times, a few
    # months after the quarter ends; check once a day.
    - cron: 41 15 * * *
  workflow_dispatch:

defaults:
  run:
    working-directory: data/uscis

permissions:
  contents: write

jobs:
  update-forms-data:
    name: Update USCIS forms data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          # The dependency cache is keyed on the lockfile and saved by the
          # action's post step, even when a later step fails.
          enable-cache: true
          cache-dependency-glob: data/uscis/uv.lock
      # The ~150 quarterly reports are re-fetched through the Wayback Machine
      # when uscis.gov blocks us; keep them between runs. The key includes the
      # run id so every run saves a fresh cache while restore-keys picks up the
      # newest previous one.
      - name: Restore downloaded reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/uscis/reports/
          key: ${{ runner.os }}-uscis-reports-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-uscis-reports-
      - name: Install dependencies
        run: uv sync --locked
      # -u: unbuffered, so the log shows each line when it happens
      - name: Run script
        run: uv run python -u forms.py
      - name: Save downloaded reports
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/uscis/reports/
          key: ${{ runner.os }}-uscis-reports-${{ github.run_id }}
      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: Update USCIS forms data
          # The default (`git fetch --tags --force`) pulls the whole history of
          # the 100 MB data dumps into the shallow clone: 3-4 minutes per run.
          fetch: false
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.update-forms-data.outputs.updated == 'true'
    uses: underyx/visawhen/.github/workflows/build.yml@main
    needs: [update-forms-data]
    with:
      ref: ${{ needs.update-forms-data.outputs.new-commit-sha }}

  deploy:
    uses: underyx/visawhen/.github/workflows/deploy.yml@main
    needs: [build]
    # When nothing was pushed, build is skipped; a skipped dependency already
    # skips this job (no `always()`), but be explicit about it.
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
