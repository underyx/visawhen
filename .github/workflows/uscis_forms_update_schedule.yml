name: Update USCIS forms data

on:
  schedule:
    # USCIS publishes its quarterly reports at irregular times, a few
    # months after the quarter ends; check once a day.
    - cron: 41 15 * * *
  workflow_dispatch:

# Only the job that commits the data can push; the build and deploy jobs,
# which run third-party code, get a read-only token.
permissions:
  contents: read

jobs:
  update-forms-data:
    name: Update USCIS forms data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # --frozen-lockfile: fail rather than change bun.lock
      - run: bun install --frozen-lockfile
      # The ~150 quarterly reports are re-fetched through the Wayback Machine
      # when uscis.gov blocks us; keep them between runs. The key includes the
      # run id so every run saves a fresh cache while restore-keys picks up the
      # newest previous one.
      - name: Restore downloaded reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/uscis/reports/
          key: ${{ runner.os }}-uscis-reports-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-uscis-reports-
      - name: Run script
        run: bun data/uscis/forms.ts
      - name: Save downloaded reports
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/uscis/reports/
          key: ${{ runner.os }}-uscis-reports-${{ github.run_id }}
      - name: Commit changes
        id: commit
        env:
          MESSAGE: Update USCIS forms data
          ACTOR: ${{ github.actor }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="$ACTOR" -c user.email="$ACTOR@users.noreply.github.com" \
            commit --quiet --message "$MESSAGE"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.update-forms-data.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    needs: [update-forms-data]
    with:
      ref: ${{ needs.update-forms-data.outputs.new-commit-sha }}

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: [build]
    # When nothing was pushed, build is skipped; a skipped dependency already
    # skips this job (no `always()`), but be explicit about it.
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
