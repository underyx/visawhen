name: Update consulates data

on:
  schedule:
    # check every day
    - cron: 19 14 * * *
  workflow_dispatch:

# Only the job that commits the data can push; the build and deploy jobs,
# which run third-party code, get a read-only token.
permissions:
  contents: read

jobs:
  update-consulates-data:
    name: Update consulates data
    runs-on: ubuntu-24.04
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # --frozen-lockfile: fail rather than change bun.lock
      - run: bun install --frozen-lockfile

      # The cache is restored and saved in separate steps (cache/restore +
      # cache/save with `if: always()`) so that whatever was downloaded
      # before a failure is kept for the next run. The key includes the run
      # id so every run saves a fresh cache while restore-keys picks up the
      # newest previous one.
      # The monthly PDFs (~200 MB) are re-fetched from the Wayback Machine when
      # travel.state.gov blocks us; keep them between runs.
      - name: Restore downloaded PDFs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/pdfs/
          key: ${{ runner.os }}-consulates-pdfs-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-consulates-pdfs-

      # Reads every PDF again (under a minute) and rewrites dump/
      - name: Read the issuance PDFs
        run: bun data/consulates/visa_issuances.ts

      - name: Save downloaded PDFs
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/pdfs/
          key: ${{ runner.os }}-consulates-pdfs-${{ github.run_id }}

      - name: Commit changes
        id: commit
        env:
          MESSAGE: Update consulates data
          ACTOR: ${{ github.actor }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="$ACTOR" -c user.email="$ACTOR@users.noreply.github.com" \
            commit --quiet --message "$MESSAGE"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.update-consulates-data.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    needs: [update-consulates-data]
    with:
      ref: ${{ needs.update-consulates-data.outputs.new-commit-sha }}

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: [build]
    # When nothing was pushed, build is skipped; a skipped dependency already
    # skips this job (no `always()`), but be explicit about it.
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
