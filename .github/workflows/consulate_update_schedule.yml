name: Update consulates data

on:
  schedule:
    # check every day
    - cron: 19 14 * * *
  workflow_dispatch:

defaults:
  run:
    working-directory: data/consulates

permissions:
  contents: write

jobs:
  update-consulates-data:
    name: Update consulates data
    runs-on: ubuntu-22.04
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up poetry
        run: pipx install "poetry<2"
      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-data-consulates-${{ hashFiles('data/consulates/poetry.lock') }}
      # actions/cache paths are relative to the workspace, not to the job's
      # working-directory. Keys include the run id so every run saves a fresh
      # cache while restore-keys picks up the newest previous one.
      - name: Cache joblib results
        uses: actions/cache@v5
        with:
          path: data/consulates/.joblib_cache/
          key: ${{ runner.os }}-consulates-joblib-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-consulates-joblib-
      # The monthly PDFs (~200 MB) are re-fetched from the Wayback Machine when
      # travel.state.gov blocks us; keep them between runs.
      - name: Cache downloaded PDFs
        uses: actions/cache@v5
        with:
          path: data/consulates/pdfs/
          key: ${{ runner.os }}-consulates-pdfs-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-consulates-pdfs-
      - name: Install required C libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libxml2-dev libxslt1-dev
      - name: Install dependencies
        run: poetry install
      - name: Run script
        run: poetry run jupyter nbconvert --to notebook --execute visa-issuances.ipynb
      - name: Run other script
        run: poetry run jupyter nbconvert --to notebook --execute baselines.ipynb
      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@v11
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.update-consulates-data.outputs.updated == 'true'
    uses: underyx/visawhen/.github/workflows/build.yml@main
    needs: [update-consulates-data]
    with:
      ref: ${{ needs.update-consulates-data.outputs.new-commit-sha }}

  deploy:
    uses: underyx/visawhen/.github/workflows/deploy.yml@main
    needs: [build]
    # When nothing was pushed, build is skipped; a skipped dependency already
    # skips this job (no `always()`), but be explicit about it.
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
