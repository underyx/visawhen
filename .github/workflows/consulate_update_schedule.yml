name: Update consulates data

on:
  schedule:
    # check every day
    - cron: 19 14 * * *
  workflow_dispatch:

defaults:
  run:
    # bash (rather than the runner's default `sh -e`) enables pipefail, so the
    # `nbconvert | python` pipelines below fail when the notebook fails.
    shell: bash
    working-directory: data/consulates

# Only the job that commits the data can push; the build and deploy jobs,
# which run third-party code, get a read-only token.
permissions:
  contents: read

jobs:
  update-consulates-data:
    name: Update consulates data
    runs-on: ubuntu-24.04
    outputs:
      new-commit-sha: ${{ steps.head_commit.outputs.commit_sha }}
      updated: ${{ steps.commit.outputs.pushed }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          # The dependency cache is keyed on the lockfile and saved by the
          # action's post step, even when a later step fails.
          enable-cache: true
          cache-dependency-glob: data/consulates/uv.lock

      # The caches below are restored and saved in separate steps
      # (cache/restore + cache/save with `if: always()`) so that whatever was
      # downloaded or computed before a failure is kept for the next run.
      #
      # actions/cache paths are relative to the workspace, not to the job's
      # working-directory.
      # Keys include the run id so every run saves a fresh cache while
      # restore-keys picks up the newest previous one.
      - name: Restore joblib results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/.joblib_cache/
          key: ${{ runner.os }}-consulates-joblib-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-consulates-joblib-
      # The monthly PDFs (~200 MB) are re-fetched from the Wayback Machine when
      # travel.state.gov blocks us; keep them between runs.
      - name: Restore downloaded PDFs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/pdfs/
          key: ${{ runner.os }}-consulates-pdfs-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-consulates-pdfs-

      # The dev group is installed too: the notebooks import IPython, which
      # comes with ipykernel.
      - name: Install dependencies
        run: uv sync --locked

      # The notebooks are converted to scripts and streamed into python instead
      # of being executed with `nbconvert --execute`: output shows up in the job
      # log as it happens, and `::warning::` lines reach GitHub as annotations.
      # The notebooks import display() from IPython themselves (it is only a
      # builtin inside a kernel; outside one it prints the object's repr), and
      # pipefail makes a failing conversion fail the step.
      - name: Run visa-issuances notebook
        run: |
          uv run jupyter nbconvert --to script --stdout visa-issuances.ipynb | uv run python -u -
      - name: Run baselines notebook
        run: |
          uv run jupyter nbconvert --to script --stdout baselines.ipynb | uv run python -u -

      - name: Save joblib results
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/.joblib_cache/
          key: ${{ runner.os }}-consulates-joblib-${{ github.run_id }}
      - name: Save downloaded PDFs
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/consulates/pdfs/
          key: ${{ runner.os }}-consulates-pdfs-${{ github.run_id }}

      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          # The default (`git fetch --tags --force`) pulls the whole history of
          # the 100 MB data dumps into the shallow clone: 3-4 minutes per run.
          fetch: false
      - id: head_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.update-consulates-data.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    needs: [update-consulates-data]
    with:
      ref: ${{ needs.update-consulates-data.outputs.new-commit-sha }}

  deploy:
    uses: ./.github/workflows/deploy.yml
    needs: [build]
    # When nothing was pushed, build is skipped; a skipped dependency already
    # skips this job (no `always()`), but be explicit about it.
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
