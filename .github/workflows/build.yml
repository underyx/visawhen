name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "The git ref to build"
        required: true
        type: string
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact containing out.tar.gz, wrangler.jsonc and the deploy tools' package files"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build with Next.js
    runs-on: ubuntu-24.04
    # The install and the build run third-party code (sqlite3's install script,
    # every package next build loads), so the job gets a read-only token, and
    # checkout does not leave it in .git/config.
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.name-artifact.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # The whole history, for the sitemap's lastmod: the day each
          # section's data last changed (scripts/sitemap.ts). Without the
          # file contents of old commits, it is about a megabyte.
          fetch-depth: 0
          filter: blob:none

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          # A new cache whenever packages or source files change; a data-only
          # commit reuses the cache as it is. (hashFiles takes globs, not
          # regular expressions.)
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.js', '**/*.mjs', '**/*.ts', '**/*.tsx', '**/*.css', '!**/node_modules/**') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # --frozen-lockfile: fail rather than change bun.lock. No package runs
      # an install script: package.json's trustedDependencies is empty.
      - run: bun install --frozen-lockfile
      # Next.js runs on Bun (`bun --bun next build`, see package.json), and
      # scripts/load-consulates-db.ts loads the consulates database with
      # bun:sqlite, so the build needs no Node.js and no Python.
      - run: bun run export

      # out/version.txt says which commit a host is serving; deploy.yml reads
      # it so that an older build never replaces a newer one.
      - id: name-artifact
        name: Record the commit and name the artifact
        run: |
          sha=$(git rev-parse HEAD)
          echo "$sha" > out/version.txt
          echo "artifact-name=website-$sha" >> "$GITHUB_OUTPUT"

      - name: Create tar archive
        run: tar czf out.tar.gz -C ${{ github.workspace }}/out .

      # wrangler.jsonc and the deploy tools' package files travel with the
      # build, so deploy.yml needs no checkout and deploys with the Cloudflare
      # config and the CLI versions of the commit that was built.
      - name: Upload tar archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name-artifact.outputs.artifact-name }}
          path: |
            out.tar.gz
            wrangler.jsonc
            .github/deploy-tools/package.json
            .github/deploy-tools/package-lock.json
          # .github is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
