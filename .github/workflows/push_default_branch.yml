name: Push to main branch

on:
  push:
    branches:
      - main
  # Allow triggering a build + deploy manually (e.g. to publish data that was
  # committed while the deploy pipeline was broken).
  workflow_dispatch:

jobs:
  pre-commit:
    uses: underyx/visawhen/.github/workflows/pre-commit.yml@main

  build:
    uses: underyx/visawhen/.github/workflows/build.yml@main
    with:
      ref: ${{ github.sha }}

  deploy:
    uses: underyx/visawhen/.github/workflows/deploy.yml@main
    needs: [build]
    if: needs.build.result == 'success'
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
    secrets:
      netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
